[package]
name = "ppsc-node"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
ark-bn254 = "0.4"
ark-ff = "0.4"
ppsc-chain = { path = "../chain" }
ppsc-core = { path = "../core" }
ppsc-crypto = { path = "../crypto" }
ppsc-network = { path = "../network" }
ppsc-protocol = { path = "../protocol" }
ppsc-storage = { path = "../storage" }
rand = "0.8"

[dev-dependencies]
ark-bn254 = "0.4"
criterion = { version = "0.5", features = ["html_reports"] }

[[bench]]
name = "handoff_network"
harness = false

[[bench]]
name = "handoff_scaling"
harness = false

[[bench]]
name = "hybrid_ablation"
harness = false

[lints]
workspace = true

